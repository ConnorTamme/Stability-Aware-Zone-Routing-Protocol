# =============================================================================
# TUNING: FANET Reconnaissance (3D Gauss-Markov)
# -----------------------------------------------------------------------------
# Mirrors ../../simulations/FanetRecon/omnetpp.ini but:
#   - Fixes (numNodes, maxSpeed) at the test midpoint (30, 30 m/s).
#   - Runs the legacy ZRP / SA-ZRP OFAT sweeps AND the new GZRP joint grids
#     side-by-side, so comparisons across protocol families share the same
#     scenario, traces, and warmup.
#   - Uses a disjoint trace set (../Traces/bonnmotion_tune/, BonnMotion seeds
#     100..102) so the test traces under simulations/Traces/ stay untouched.
#   - Halves wall time: sim-time-limit=250s, warmup-period=50s, repeat=3.
#
# Naming: <Recon>_Tune<Param>_<Instance>
#   Legacy ZRP+SA-ZRP: ZoneRadius | NDPHello | IARPUpdate | IARPEventDelay |
#                       LinkLifetime
#   Legacy SA-ZRP only: EmaAlpha | DistanceExponent | Beta | StabGrenade
#   New GZRP-Classic:   Radius | RadiusPreDecay
#   New GZRP-Sazrp:     StabFraction | StabBeta | FractionBeta
#   Instance: Zrp | StabilityZrp | GzrpClassic | GzrpSazrp
# =============================================================================

[General]
ned-path = .:../../simulations/FanetRecon
network = sa_zrp.simulations.FanetRecon.FanetReconNetwork
sim-time-limit = 250s
warmup-period = 50s
repeat = 3

# ---------------------------------------------------------------------------
# Routing / ARP / Visualizer / MAC / Propagation / Constraints
#   (all identical to the test ini; rationale comments live there)
# ---------------------------------------------------------------------------
*.configurator.addStaticRoutes = false
**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"
**.forwarding = true
*.visualizer.osgVisualizer.typename = ""

*.uav[*].wlan[0].opMode = "g(mixed)"
*.groundStation.wlan[0].opMode = "g(mixed)"
**.wlan[*].bitrate = 24Mbps

*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
# Suppress INET's "two transmissions at the same simsec" check. Periodic CBRs
# from many UAVs occasionally line up on the FES at picosecond precision and
# crash the run; this is a known false-alarm for synthetic FANET workloads.
**.radioMedium.sameTransmissionStartTimeCheck = "ignore"
**.transmitter.power = 8mW
**.receiver.sensitivity = -85dBm
**.displayCommunicationRanges = true

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 3650m
**.constraintAreaMaxY = 1250m
**.constraintAreaMaxZ = 60m

*.uav[*].mobility.typename = "BonnMotionMobility"
*.uav[*].mobility.is3D = true
*.uav[*].mobility.nodeId = parent.index + 1

*.groundStation.mobility.typename = "StationaryMobility"
*.groundStation.mobility.initialX = 1800m
*.groundStation.mobility.initialY = 600m
*.groundStation.mobility.initialZ = 0m

**.scalar-recording = true
**.vector-recording = false

# endToEndDelay: drop the default histogram recording. cAutoRangeHistogramStrategy
# crashes with "appendBins(): new edges overlap with existing histogram range"
# when the delay distribution is bimodal -- e.g. SA-ZRP at high tau where some
# packets queue for many seconds while routes flap. extract_metrics.py only
# consumes count/mean/stddev from the histogram anyway, so record those plus
# min/max as scalars instead. min/max also captures the actual outlier delays,
# which the histogram bins never surfaced.
**.endToEndDelay.result-recording-modes = stats

# =============================================================================
# Tuning base: fixed midpoint (30 nodes @ 30 m/s), all-to-one CBR.
# Trace path uses ${repetition} which iterates 0..repeat-1 = 0..2, matching
# the seed{0..2}.movements files generated by ../Traces/generate_tuning_traces.py.
# =============================================================================
[Config TuneBase]
description = "Tuning base: 30 UAVs @ 30 m/s, all-to-one CBR -> groundStation"

*.numUavs = 30
*.uav[*].mobility.traceFile = "../Traces/bonnmotion_tune/recon_n30_s30_seed${repetition}.movements"

*.uav[*].app[0].typename = "UdpBasicApp"
*.uav[*].app[0].destAddresses = "groundStation"
*.uav[*].app[0].destPort = 5000
*.uav[*].app[0].messageLength = 512B
*.uav[*].app[0].sendInterval = 0.25s
# Warmup is 50s; start traffic just after warmup ends.
*.uav[*].app[0].startTime = uniform(50s, 51s)

*.groundStation.app[0].typename = "UdpSink"
*.groundStation.app[0].localPort = 5000

# Default ZRP params (each Tune* config below overrides exactly one of these).
**.app[*].zoneRadius = 2
**.app[*].NDP_helloInterval = 1s

# =============================================================================
# Per-protocol shells: install the right module and pin protocol-required params
# (e.g. SA-ZRP needs commsRange + vMax). Tune* configs extend these.
# =============================================================================
[Config ZrpBase]
extends = TuneBase
*.uav[*].typename = "AdhocHost"
*.uav[*].numApps = 2
*.uav[*].app[1].typename = "sa_zrp.Zrp"
*.groundStation.typename = "AdhocHost"
*.groundStation.numApps = 2
*.groundStation.app[1].typename = "sa_zrp.Zrp"

[Config StabilityZrpBase]
extends = TuneBase
*.uav[*].typename = "AdhocHost"
*.uav[*].numApps = 2
*.uav[*].app[1].typename = "sa_zrp.SAZRP.SaZrp"
*.groundStation.typename = "AdhocHost"
*.groundStation.numApps = 2
*.groundStation.app[1].typename = "sa_zrp.SAZRP.SaZrp"
**.app[*].commsRange = 500m
**.app[*].vMax = 30mps

# =============================================================================
# GZRP shells: install the new framework with its four strategy submodules.
# GzrpClassic = ZRP-parity (constant-1 scoring, step decay, always-admit gate).
# GzrpSazrp   = SA-ZRP-parity (LPAR stability scoring, multiplicative-beta
# decay, fraction-good gate). Tune* configs extend these.
# =============================================================================
[Config GzrpClassicBase]
extends = TuneBase
*.uav[*].typename = "AdhocHost"
*.uav[*].numApps = 2
*.uav[*].app[1].typename = "sa_zrp.GZRP.Gzrp"
*.groundStation.typename = "AdhocHost"
*.groundStation.numApps = 2
*.groundStation.app[1].typename = "sa_zrp.GZRP.Gzrp"
# enableOriginatorPreDecay falls back to the Gzrp.ned default (true), which
# applies one decayState() step at the source. For StepDecay this is the exact
# analogue of classic ZRP's TTL = R - 1 trick (originator emits byte=2 at
# radius=2, so 1-hop neighbours admit but don't rebroadcast). Without it,
# GZRP-Classic floods one hop deeper than ZRP and overhead diverges.
**.app[*].scoring.typename   = "sa_zrp.GZRP.Strategies.ConstantOneScore"
**.app[*].decay.typename     = "sa_zrp.GZRP.Strategies.StepDecay"
**.app[*].decay.radius       = 2
**.app[*].gate.typename      = "sa_zrp.GZRP.Strategies.AlwaysAdmitGate"
**.app[*].threshold.typename = "sa_zrp.GZRP.Strategies.ConstantThreshold"
**.app[*].threshold.value    = 0.5
# Match ZRP's "every reply replaces" semantics. The SAZRP/GZRP-Sazrp default
# ("stability-hops") is a high-quality-then-fewer-hops tiebreak that, under
# ConstantOneScore (every link quality == 1.0), reduces to "first-come wins" --
# diverging from ZRP whenever two equal-hop replies race.
**.app[*].ierpReplyInstallPolicy = "last-wins"

[Config GzrpSazrpBase]
extends = TuneBase
*.uav[*].typename = "AdhocHost"
*.uav[*].numApps = 2
*.uav[*].app[1].typename = "sa_zrp.GZRP.Gzrp"
*.groundStation.typename = "AdhocHost"
*.groundStation.numApps = 2
*.groundStation.app[1].typename = "sa_zrp.GZRP.Gzrp"
**.app[*].enableOriginatorPreDecay = true
**.app[*].scoring.typename         = "sa_zrp.GZRP.Strategies.LparStabilityScore"
**.app[*].scoring.commsRange       = 500m
**.app[*].scoring.vMax             = 30mps
**.app[*].scoring.distanceExponent = 4
**.app[*].decay.typename           = "sa_zrp.GZRP.Strategies.MultiplicativeBetaDecay"
**.app[*].decay.betaMin            = 0.7
**.app[*].decay.betaMax            = 0.85
**.app[*].gate.typename            = "sa_zrp.GZRP.Strategies.FractionGoodGate"
# Match SAZRP.ned's defaults so baseline GZRP-Sazrp is parameter-identical
# to baseline SA-ZRP -- tau=0.2 and q=0.4 are the SAZRP framework defaults.
**.app[*].gate.q                   = 0.4
**.app[*].threshold.typename       = "sa_zrp.GZRP.Strategies.ConstantThreshold"
**.app[*].threshold.value          = 0.2

# =============================================================================
# Legacy OFAT sweeps -- each config varies exactly ONE parameter; everything
# else stays at TuneBase defaults. Kept for direct comparison against the new
# GZRP joint grids below.
# =============================================================================

# ---- ZRP (legacy) ---------------------------------------------------------
[Config Recon_TuneRadius_Zrp]
extends = ZrpBase
description = "ZRP: sweep zoneRadius (iter var named 'radius' so it shares the Radius.png plot with GZRP-Classic for direct comparison)"
**.app[*].zoneRadius = ${radius=1,2,3,4,5,6}

[Config Recon_TuneNDPHello_Zrp]
extends = ZrpBase
description = "ZRP: sweep NDP_helloInterval"
**.app[*].NDP_helloInterval = ${NDP_helloInterval=0.5,1,2,4}s

[Config Recon_TuneIARPUpdate_Zrp]
extends = ZrpBase
description = "ZRP: sweep IARP_updateInterval"
**.app[*].IARP_updateInterval = ${IARP_updateInterval=2,4,6,8}s

[Config Recon_TuneIARPEventDelay_Zrp]
extends = ZrpBase
description = "ZRP: sweep IARP_eventDelay"
**.app[*].IARP_eventDelay = ${IARP_eventDelay=50,150,300,400,500,700}ms

[Config Recon_TuneLinkLifetime_Zrp]
extends = ZrpBase
description = "ZRP: sweep linkStateLifetime"
**.app[*].linkStateLifetime = ${linkStateLifetime=2,4,6,8,12}s

# ---- SA-ZRP (legacy) ------------------------------------------------------
[Config Recon_TuneNDPHello_StabilityZrp]
extends = StabilityZrpBase
description = "SA-ZRP: sweep NDP_helloInterval"
**.app[*].NDP_helloInterval = ${NDP_helloInterval=0.5,1,2,4}s

[Config Recon_TuneIARPUpdate_StabilityZrp]
extends = StabilityZrpBase
description = "SA-ZRP: sweep IARP_updateInterval"
**.app[*].IARP_updateInterval = ${IARP_updateInterval=2,4,6,8}s

[Config Recon_TuneIARPEventDelay_StabilityZrp]
extends = StabilityZrpBase
description = "SA-ZRP: sweep IARP_eventDelay"
**.app[*].IARP_eventDelay = ${IARP_eventDelay=50,150,300,400,500,700}ms

[Config Recon_TuneLinkLifetime_StabilityZrp]
extends = StabilityZrpBase
description = "SA-ZRP: sweep linkStateLifetime"
**.app[*].linkStateLifetime = ${linkStateLifetime=2,4,6,8,12}s

[Config Recon_TuneEmaAlpha_StabilityZrp]
extends = StabilityZrpBase
description = "SA-ZRP: sweep emaAlpha (per-link stability EMA smoothing factor)"
**.app[*].emaAlpha = ${emaAlpha=0.1,0.2,0.3,0.5,0.8}

[Config Recon_TuneDistanceExponent_StabilityZrp]
extends = StabilityZrpBase
description = "SA-ZRP: sweep distanceExponent p in D = 1 - (d/R)^p"
**.app[*].distanceExponent = ${distanceExponent=1,2,4,8}

[Config Recon_TuneStabBeta_StabilityZrp]
extends = StabilityZrpBase
description = "SA-ZRP: joint sweep stabilityThreshold x betaMax (mirrors GZRP-Sazrp StabBeta so the two protocols overlay cell-for-cell)"
**.app[*].stabilityThreshold = ${threshold=0.1,0.2,0.3,0.4}
**.app[*].betaMax            = ${betaMax=0.7,0.8,0.9,0.95}
**.app[*].betaMin            = 0.7

# 2D joint sweep: tau on x-axis, one line per fractionGoodThreshold.
# extract_metrics.py recognizes the "StabGrenade" param tag and emits a
# multi-line plot for it.
[Config Recon_TuneStabGrenade_StabilityZrp]
extends = StabilityZrpBase
description = "SA-ZRP: joint sweep stabilityThreshold x fractionGoodThreshold"
**.app[*].stabilityThreshold = ${stabilityThreshold=0.1,0.2,0.3,0.4}
**.app[*].fractionGoodThreshold = ${fractionGoodThreshold=0.4,0.6,0.8}
**.app[*].betaMin = 0.7
**.app[*].betaMax = 0.85

# =============================================================================
# New GZRP joint sweeps. Iter var names match the strategy parameter names so
# extract_metrics can use them as the x-axis without a translation table.
# =============================================================================

# ---- GZRP-Classic ---------------------------------------------------------
[Config Recon_TuneRadius_GzrpClassic]
extends = GzrpClassicBase
description = "GZRP-Classic: 1-D sweep of StepDecay.radius (zoneRadius parity)"
**.app[*].decay.radius = ${radius=1,2,3,4,5,6}

[Config Recon_TuneRadiusPreDecay_GzrpClassic]
extends = GzrpClassicBase
description = "GZRP-Classic: joint sweep radius x originator pre-decay (TTL=R vs TTL=R-1)"
**.app[*].decay.radius             = ${radius=1,2,3,4}
**.app[*].enableOriginatorPreDecay = ${preDecay=false,true}

# ---- GZRP-Sazrp -----------------------------------------------------------
[Config Recon_TuneStabFraction_GzrpSazrp]
extends = GzrpSazrpBase
description = "GZRP-Sazrp: joint sweep stability threshold x fraction-good q"
**.app[*].threshold.value = ${threshold=0.1,0.2,0.3,0.4}
**.app[*].gate.q          = ${q=0.3,0.5,0.7,0.9}

[Config Recon_TuneStabBeta_GzrpSazrp]
extends = GzrpSazrpBase
description = "GZRP-Sazrp: joint sweep stability threshold x betaMax"
**.app[*].threshold.value = ${threshold=0.1,0.2,0.3,0.4}
**.app[*].decay.betaMax   = ${betaMax=0.7,0.8,0.9,0.95}

[Config Recon_TuneFractionBeta_GzrpSazrp]
extends = GzrpSazrpBase
description = "GZRP-Sazrp: joint sweep fraction-good q x betaMax"
**.app[*].gate.q          = ${q=0.3,0.5,0.7,0.9}
**.app[*].decay.betaMax   = ${betaMax=0.7,0.8,0.9,0.95}

# =============================================================================
# Baseline runs: each protocol family at its framework defaults, no sweep.
# extract_metrics.py picks these up as param_short=Baseline and emits a
# four-bar comparison plot at figs/baseline_compare.png. Naming uses the
# Tune prefix so the run driver's `_Tune` filter picks them up.
# =============================================================================
[Config Recon_TuneBaseline_Zrp]
extends = ZrpBase
description = "Baseline: ZRP at framework defaults"

[Config Recon_TuneBaseline_StabilityZrp]
extends = StabilityZrpBase
description = "Baseline: SA-ZRP at framework defaults"

[Config Recon_TuneBaseline_GzrpClassic]
extends = GzrpClassicBase
description = "Baseline: GZRP-Classic at framework defaults"

[Config Recon_TuneBaseline_GzrpSazrp]
extends = GzrpSazrpBase
description = "Baseline: GZRP-Sazrp at framework defaults"

# =============================================================================
# Per-host RNG diagnostic. Used during the ZRP vs GZRP-Classic parity hunt to
# break the global-RNG-0 sharing that lets one host's MAC backoff cascade into
# another host's protocol timer jitter. If GZRP-Classic and ZRP produce
# matching metrics under per-host RNG but diverge under shared RNG, the
# residual gap is RNG cascade amplification of a tiny algorithmic difference.
# If they still diverge under per-host RNG, the difference is genuinely
# algorithmic (e.g. in the routing decisions themselves).
#
# Usage: extend the baseline config from these instead of from the bases
#   ./run -u Cmdenv -c Recon_Diag_Zrp_PerHostRng -r 0
#   ./run -u Cmdenv -c Recon_Diag_GzrpClassic_PerHostRng -r 0
# 32 RNGs: 30 UAVs + groundStation + radioMedium. Each module's getRNG(0)
# routes to its host's dedicated stream so MAC backoff at uav[3] does not
# advance the RNG state seen by uav[7]'s NDP timer scheduling.
# =============================================================================
[Config _PerHostRngBase]
num-rngs = 32
*.uav[0].**.rng-0 = 0
*.uav[1].**.rng-0 = 1
*.uav[2].**.rng-0 = 2
*.uav[3].**.rng-0 = 3
*.uav[4].**.rng-0 = 4
*.uav[5].**.rng-0 = 5
*.uav[6].**.rng-0 = 6
*.uav[7].**.rng-0 = 7
*.uav[8].**.rng-0 = 8
*.uav[9].**.rng-0 = 9
*.uav[10].**.rng-0 = 10
*.uav[11].**.rng-0 = 11
*.uav[12].**.rng-0 = 12
*.uav[13].**.rng-0 = 13
*.uav[14].**.rng-0 = 14
*.uav[15].**.rng-0 = 15
*.uav[16].**.rng-0 = 16
*.uav[17].**.rng-0 = 17
*.uav[18].**.rng-0 = 18
*.uav[19].**.rng-0 = 19
*.uav[20].**.rng-0 = 20
*.uav[21].**.rng-0 = 21
*.uav[22].**.rng-0 = 22
*.uav[23].**.rng-0 = 23
*.uav[24].**.rng-0 = 24
*.uav[25].**.rng-0 = 25
*.uav[26].**.rng-0 = 26
*.uav[27].**.rng-0 = 27
*.uav[28].**.rng-0 = 28
*.uav[29].**.rng-0 = 29
*.groundStation.**.rng-0 = 30
*.radioMedium.**.rng-0 = 31

[Config Recon_Diag_Zrp_PerHostRng]
extends = ZrpBase, _PerHostRngBase
description = "DIAGNOSTIC: ZRP baseline with per-host RNG (parity hunt)"

[Config Recon_Diag_GzrpClassic_PerHostRng]
extends = GzrpClassicBase, _PerHostRngBase
description = "DIAGNOSTIC: GZRP-Classic baseline with per-host RNG (parity hunt)"
